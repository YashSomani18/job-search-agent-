name: Daily Job Search

on:
  schedule:
    # Run daily at 8:00 AM IST (2:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  job-search:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          GROQ_MODEL="${{ secrets.GROQ_MODEL }}"
          echo "GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}" >> .env
          echo "GMAIL_USER=${{ secrets.GMAIL_USER }}" >> .env
          echo "GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}" >> .env
          echo "EMAIL_TO=${{ secrets.EMAIL_TO }}" >> .env
          echo "JOB_KEYWORDS=${{ secrets.JOB_KEYWORDS }}" >> .env
          JOB_LOCATION="${{ secrets.JOB_LOCATION }}"
          echo "JOB_LOCATION=${JOB_LOCATION:-India}" >> .env
          MAX_JOBS="${{ secrets.MAX_JOBS }}"
          echo "MAX_JOBS=${MAX_JOBS:-100}" >> .env
          
          # User Profile Configuration (Recommended for better matching)
          echo "USER_SKILLS=${{ secrets.USER_SKILLS }}" >> .env
          echo "USER_EXPERIENCE_LEVEL=${{ secrets.USER_EXPERIENCE_LEVEL }}" >> .env
          echo "USER_YEARS_EXPERIENCE=${{ secrets.USER_YEARS_EXPERIENCE }}" >> .env
          echo "USER_CURRENT_ROLE=${{ secrets.USER_CURRENT_ROLE }}" >> .env
          echo "USER_INDUSTRY=${{ secrets.USER_INDUSTRY }}" >> .env
          echo "USER_PREFERENCES=${{ secrets.USER_PREFERENCES }}" >> .env
          
          LINKEDIN_ENABLED="${{ secrets.LINKEDIN_ENABLED }}"
          echo "LINKEDIN_ENABLED=${LINKEDIN_ENABLED:-true}" >> .env
          INDEED_ENABLED="${{ secrets.INDEED_ENABLED }}"
          echo "INDEED_ENABLED=${INDEED_ENABLED:-true}" >> .env
          NAUKRI_ENABLED="${{ secrets.NAUKRI_ENABLED }}"
          echo "NAUKRI_ENABLED=${NAUKRI_ENABLED:-true}" >> .env
          GLASSDOOR_ENABLED="${{ secrets.GLASSDOOR_ENABLED }}"
          echo "GLASSDOOR_ENABLED=${GLASSDOOR_ENABLED:-true}" >> .env
          HIRIST_ENABLED="${{ secrets.HIRIST_ENABLED }}"
          echo "HIRIST_ENABLED=${HIRIST_ENABLED:-true}" >> .env
          WELLFOUND_ENABLED="${{ secrets.WELLFOUND_ENABLED }}"
          echo "WELLFOUND_ENABLED=${WELLFOUND_ENABLED:-true}" >> .env
          JOBSLEVER_ENABLED="${{ secrets.JOBSLEVER_ENABLED }}"
          echo "JOBSLEVER_ENABLED=${JOBSLEVER_ENABLED:-true}" >> .env
          
          # API-based Job Search (Legal & Reliable)
          JSEARCH_ENABLED="${{ secrets.JSEARCH_ENABLED }}"
          echo "JSEARCH_ENABLED=${JSEARCH_ENABLED:-true}" >> .env
          echo "JSEARCH_API_KEY=${{ secrets.JSEARCH_API_KEY }}" >> .env
          JSEARCH_MAX_DAILY_REQUESTS="${{ secrets.JSEARCH_MAX_DAILY_REQUESTS }}"
          echo "JSEARCH_MAX_DAILY_REQUESTS=${JSEARCH_MAX_DAILY_REQUESTS:-6}" >> .env
          
          ADZUNA_ENABLED="${{ secrets.ADZUNA_ENABLED }}"
          echo "ADZUNA_ENABLED=${ADZUNA_ENABLED:-false}" >> .env
          echo "ADZUNA_API_KEY=${{ secrets.ADZUNA_API_KEY }}" >> .env
          echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env

          APIFY_ENABLED="${{ secrets.APIFY_ENABLED }}"
          echo "APIFY_ENABLED=${APIFY_ENABLED:-false}" >> .env
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" >> .env
          
          REQUEST_DELAY="${{ secrets.REQUEST_DELAY }}"
          echo "REQUEST_DELAY=${REQUEST_DELAY:-2.0}" >> .env
          REQUEST_TIMEOUT="${{ secrets.REQUEST_TIMEOUT }}"
          echo "REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}" >> .env
      
      - name: Run job search agent
        run: |
          python job_search_agent.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-logs
          path: |
            job_search.log
          retention-days: 7

